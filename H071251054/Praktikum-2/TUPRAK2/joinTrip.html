<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengisian Data Diri</title>
    <link rel="stylesheet" href="style2.css" />
</head>

<body>
    <header>
        <h1>Mengisi data diri untuk mengclaim bangku Anda!</h1>
        <p>Daftarkan dirimu sekarang untuk mendapatkan pengalaman yang tak terlupakan!</p>
    </header>

    <nav>
        <a href="wisataBiak.html">Kembali ke Beranda</a>
    </nav>


    <br>

    <section>
        <form action="">
            <label for="nama">Nama Lengkap: </label>
            <input type="text" id="nama" name="nama" required>

            <!-- <br> -->

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required>

            <br>

            <label>Paket Perjalanan: </label>
            <br>
            <input type="checkbox" id="paket1" name="paket" value="3_hari_2_malam">
            <label for="paket1">3 Hari 2 Malam</label>

            <br>

            <input type="checkbox" id="paket2" name="paket" value="5_hari_4_malam">
            <label for="paket2">5 Hari 4 Malam</label>

            <br><br>

            <input type="submit" id="tombolDaftar" value="Daftar Sekarang">
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Portal Wisata Pulau Biak.</p>
    </footer>
</body>

</html>
