<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tugas Marsha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">
    <div class="bg-blue-600 rounded-2xl text-white p-8 mb-8">
        <h1 class="text-3xl font-bold mb-2">Dashboard Tim</h1>
    </div>

    <div class="bg-white p-6 border rounded-xl mb-8">
        <h2 class="text-2xl font-bold mb-4">Daftar Anggota</h2>
        <p id="statusAnggota" class="text-slate-600">Memuat anggota...</p>
        <div id="daftarAnggota" class="flex flex-col gap-2"></div>
    </div>

    <div class="bg-white p-6 border rounded-xl hidden" id="panelTugas">
        <h2 id="judulTugas" class="text-2xl font-bold mb-2">Tugas Anggota</h2>
        <p id="ringkasanTugas" class="text-slate-600 font-bold mb-6">0 dari 0 tugas selesai</p>

        <form id="formTambah" class="flex gap-2 mb-2">
            <input type="text" id="inputTugas" class="border p-2 rounded w-full bg-slate-50" placeholder="Tambah tugas baru...">
            <button type="submit" id="btnSimpan" class="bg-blue-600 text-white px-4 py-2 rounded">Simpan</button>
        </form>
        <p id="pesanErrorForm" class="text-red-500 text-sm mb-2"></p>
        <p id="pesanSukses" class="text-green-500 text-sm mb-6"></p>

        <input type="text" id="inputCari" class="border p-2 rounded w-full mb-2 bg-slate-50" placeholder="Cari tugas...">
        <p id="pesanKosongCari" class="text-slate-500 text-sm mb-4 hidden">Tidak ada tugas yang cocok.</p>

        <p id="statusTugas" class="text-slate-600 mb-4"></p>
        <ul id="daftarTugas" class="flex flex-col gap-3"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
